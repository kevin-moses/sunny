# .pre-commit-config.yaml
# Pre-commit hooks for the sunny repo.
# Covers Python (ruff lint+format, mypy), the Expo app (prettier, eslint, tsc) and the
# Convex backend in sunny_backend (tsc and prettier for convex/, scripts/ and evals/).
#
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hook versions: pre-commit autoupdate
#
# The TypeScript hooks need `npm install` run once in sunny_app and in sunny_backend
# (tsc, eslint and prettier come from their node_modules).
#
# Note: prettier and ruff auto-fix files in place. If a commit is blocked
# because files were modified, re-stage the changes and commit again.

repos:
  # --- Python: ruff lint (with auto-fix) and format ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^sunny_agent/
      - id: ruff-format
        files: ^sunny_agent/

  # --- Python: mypy type checking ---
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd sunny_agent && uv run mypy src/ tests/ scripts/'
        language: system
        types: [python]
        pass_filenames: false
        files: ^sunny_agent/

  # --- TypeScript (Convex backend): tsc type check and prettier (auto-formats in place) ---
  - repo: local
    hooks:
      - id: convex-tsc
        name: convex tsc
        entry: bash -c 'cd sunny_backend && npx tsc --noEmit -p convex'
        language: system
        pass_filenames: false
        files: ^sunny_backend/convex/
        exclude: ^sunny_backend/convex/_generated/
      - id: scripts-tsc
        name: backend scripts tsc
        entry: bash -c 'cd sunny_backend && npx tsc --noEmit -p scripts'
        language: system
        pass_filenames: false
        files: ^sunny_backend/(scripts/|convex/)
        exclude: ^sunny_backend/convex/_generated/
      - id: evals-tsc
        name: backend evals tsc
        entry: bash -c 'cd sunny_backend && npx tsc --noEmit -p evals'
        language: system
        pass_filenames: false
        files: ^sunny_backend/(evals/|convex/)
        exclude: ^sunny_backend/convex/_generated/
      - id: convex-prettier
        name: convex prettier
        entry: bash -c 'cd sunny_backend && npx prettier --write "${@#sunny_backend/}"' --
        language: system
        pass_filenames: true
        files: ^sunny_backend/((convex|scripts)/|evals/.*\.ts$)
        exclude: ^sunny_backend/convex/_generated/

  # --- sunny_app (Expo / TypeScript): prettier (auto-formats), eslint, tsc ---
  # Run against the whole app from inside sunny_app so its configs and node_modules
  # apply.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd sunny_app && npx prettier --write . --log-level warn'
        language: system
        pass_filenames: false
        files: ^sunny_app/
      - id: eslint
        name: eslint
        entry: bash -c 'cd sunny_app && npx eslint . --max-warnings 0'
        language: system
        pass_filenames: false
        files: ^sunny_app/
      - id: tsc
        name: tsc
        entry: bash -c 'cd sunny_app && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^sunny_app/

  # --- No comments, docstrings or suppression pragmas in code (CLAUDE.md) ---
  # Parser-based, so a # or // inside a string, template, regex or JSX text is not flagged.
  - repo: local
    hooks:
      - id: no-comments-python
        name: no comments (python)
        entry: bash -c 'cd sunny_agent && uv run python scripts/no_comments.py "${@/#/../}"' --
        language: system
        pass_filenames: true
        files: (\.py|(^|/)pyproject\.toml)$
      - id: no-comments-ts
        name: no comments (ts/js)
        entry: bash -c 'cd sunny_backend && npx tsx scripts/checkNoComments.ts "${@/#/../}"' --
        language: system
        pass_filenames: true
        files: \.(ts|tsx|mts|cts|js|jsx|mjs|cjs)$
        exclude: (^|/)(_generated|node_modules)/
