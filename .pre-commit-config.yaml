# .pre-commit-config.yaml
# Pre-commit hooks for the sunny repo.
# Covers Python (ruff lint+format, mypy) and the Expo app (prettier, eslint, tsc).
#
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hook versions: pre-commit autoupdate
#
# Note: prettier and ruff auto-fix files in place. If a commit is blocked
# because files were modified, re-stage the changes and commit again.

repos:
  # --- Python: ruff lint (with auto-fix) and format ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^sunny_agent/
      - id: ruff-format
        files: ^sunny_agent/

  # --- Python: mypy type checking ---
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd sunny_agent && uv run mypy src/ --ignore-missing-imports'
        language: system
        types: [python]
        pass_filenames: false
        files: ^sunny_agent/

  # --- sunny_app (Expo / TypeScript): prettier (auto-formats), eslint, tsc ---
  # Run against the whole app from inside sunny_app so its configs and node_modules
  # apply. Needs `npm install` in sunny_app first.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd sunny_app && npx prettier --write . --log-level warn'
        language: system
        pass_filenames: false
        files: ^sunny_app/
      - id: eslint
        name: eslint
        entry: bash -c 'cd sunny_app && npx eslint . --max-warnings 0'
        language: system
        pass_filenames: false
        files: ^sunny_app/
      - id: tsc
        name: tsc
        entry: bash -c 'cd sunny_app && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^sunny_app/
